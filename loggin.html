<!DOCTYPE html>
<!-- Coding By CodingNepal - www.codingnepalweb.com -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PD Restaurant Loggin Page</title>
    <link rel="stylesheet" href="./assets/css/loggin.css">
    <link href="assets/img/my icon.png" rel="icon">
</head>
<body>

    <div class="form-wrapper">
        <h2>Log In to<br> <span>PD Restaurant</span> </h2>
        <form action="#">
            <div class="form-control">
                <input type="text" required>
                <label>Email or phone number</label>
            </div>
            <div class="form-control">
                <input type="password" required>
                <label>Password</label>
            </div>
            <button type="submit">Sign In</button>
            <div class="form-help"> 
                <div class="remember-me">
                    <input type="checkbox" id="remember-me">
                    <label for="remember-me">Remember me</label>
                </div>
                <a href="#">Need help?</a>
            </div>
        </form>
        <p>New to Our Resturant? <a href="#">Sign up now</a></p>
    </div>
</body>
</html>
